server {
    listen 80;
    # server_name _;

    root /var/www/uptime;
    index index.html;

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html — so a new deploy takes effect on the very next
    # page load instead of the browser reusing a stale bundle reference.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running endpoints (multi-country ping, AI analyze) can exceed
        # the 60s default, which makes nginx return 504 before the backend
        # finishes. Keep this above the backend's own 90s context timeout.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # WebSocket
    location /api/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Cache hashed static assets aggressively (safe: filename changes every build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
